<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640">
  <!-- 個人OKRの1か月の流れ。週の目標と自己評価は任意（破線で示す）。 -->
  <rect x="1" y="1" width="638" height="468" rx="10" style="fill:var(--color-bg-secondary);stroke:var(--color-border-primary)" />
  <text x="320" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">個人OKR：1か月の流れ</text>

  <!-- 1 今月の計画 -->
  <rect x="20" y="48" width="170" height="64" rx="8" style="fill:var(--color-bg-info);stroke:var(--color-border-info)" />
  <text x="105" y="86" text-anchor="middle" font-size="15" font-weight="700" style="fill:var(--color-text-info)">1. 今月の計画</text>
  <text x="206" y="68" font-size="13" fill="currentColor">取り組む内容・当月末の達成目標・リスク・</text>
  <text x="206" y="88" font-size="13" fill="currentColor">今月のウェイトを書く</text>
  <text x="206" y="106" font-size="13" style="fill:var(--color-text-secondary)">「✦ 前月をふまえて下書き」でAIが下書きできる</text>

  <!-- 2 週の目標（任意） -->
  <rect x="20" y="136" width="170" height="64" rx="8" stroke-dasharray="6 4" style="fill:var(--color-bg-primary);stroke:var(--color-border-secondary)" />
  <text x="105" y="162" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">2. 週の目標</text>
  <text x="105" y="184" text-anchor="middle" font-size="13" style="fill:var(--color-text-secondary)">（任意）</text>
  <text x="206" y="156" font-size="13" fill="currentColor">その週末の状態を書き、◯／△／✕で自己評価</text>
  <text x="206" y="176" font-size="13" fill="currentColor">使う場合だけ記入する。未記入でもよい</text>

  <!-- 3 実施記録 -->
  <rect x="20" y="224" width="170" height="64" rx="8" style="fill:var(--color-bg-success);stroke:var(--color-border-success)" />
  <text x="105" y="262" text-anchor="middle" font-size="15" font-weight="700" style="fill:var(--color-text-success)">3. 実施記録</text>
  <text x="206" y="244" font-size="13" fill="currentColor">計画外の対応・方針転換など、実際に</text>
  <text x="206" y="264" font-size="13" fill="currentColor">起きたことを自由に書く</text>
  <text x="206" y="282" font-size="13" style="fill:var(--color-text-secondary)">振り返りの下書き（AI）の材料になる</text>

  <!-- 4 振り返り -->
  <rect x="20" y="312" width="170" height="64" rx="8" style="fill:var(--color-bg-warning);stroke:var(--color-border-warning)" />
  <text x="105" y="350" text-anchor="middle" font-size="15" font-weight="700" style="fill:var(--color-text-warning)">4. 振り返り</text>
  <text x="206" y="332" font-size="13" fill="currentColor">本文・自己評価%・GM評価%・GMコメントを</text>
  <text x="206" y="352" font-size="13" fill="currentColor">記録する。過去月も編集できる</text>
  <text x="206" y="370" font-size="13" style="fill:var(--color-text-secondary)">「📝 振り返りの下書き」でAIが下書きできる</text>

  <!-- 下向き矢印 -->
  <path d="M105 114 V132 M105 202 V220 M105 290 V308" style="stroke:var(--color-text-tertiary)" stroke-width="2" fill="none" />
  <path d="M99 126 L105 134 L111 126 M99 214 L105 222 L111 214 M99 302 L105 310 L111 302" style="stroke:var(--color-text-tertiary)" stroke-width="2" fill="none" />

  <!-- 下部の補足 -->
  <rect x="20" y="396" width="600" height="56" rx="8" style="fill:var(--color-bg-primary);stroke:var(--color-border-primary)" />
  <text x="34" y="420" font-size="13" fill="currentColor">計画と振り返りは「📋 全文をコピー（Kintone用）」でKintoneへ貼り付けられる。</text>
  <text x="34" y="440" font-size="13" fill="currentColor">正本はKintone。評価の確定はKintone側で行う。未来の月は編集できない。</text>
</svg>
