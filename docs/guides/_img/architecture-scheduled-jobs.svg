<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 384" width="640">
  <!-- 定期処理：pg_cron から起動される処理と結果の知らせ方（時刻は日本時間） -->
  <rect x="1" y="1" width="638" height="382" rx="10" style="fill:var(--color-bg-secondary);stroke:var(--color-border-primary)" />
  <text x="320" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">定期処理と、結果の知らせ方（時刻は日本時間）</text>

  <!-- pg_cron -->
  <rect x="20" y="56" width="110" height="308" rx="8" style="fill:var(--color-bg-success);stroke:var(--color-border-success)" />
  <text x="75" y="190" text-anchor="middle" font-size="15" font-weight="700" style="fill:var(--color-text-success)">pg_cron</text>
  <text x="75" y="212" text-anchor="middle" font-size="12" fill="currentColor">Supabase の</text>
  <text x="75" y="228" text-anchor="middle" font-size="12" fill="currentColor">定期実行</text>

  <!-- 行1：backup-daily -->
  <rect x="170" y="56" width="220" height="92" rx="8" style="fill:var(--color-bg-info);stroke:var(--color-border-info)" />
  <text x="182" y="80" font-size="14" font-weight="700" style="fill:var(--color-text-info)">backup-daily</text>
  <text x="182" y="100" font-size="13" fill="currentColor">毎日 3:00</text>
  <text x="182" y="120" font-size="13" fill="currentColor">全体と部署別のバックアップ</text>
  <text x="182" y="138" font-size="12" style="fill:var(--color-text-secondary)">Edge Function</text>

  <rect x="430" y="56" width="190" height="92" rx="8" style="fill:var(--color-bg-primary);stroke:var(--color-border-primary)" />
  <text x="442" y="78" font-size="13" font-weight="700" fill="currentColor">結果</text>
  <text x="442" y="98" font-size="12" fill="currentColor">・Storage に JSON を保存</text>
  <text x="442" y="116" font-size="12" fill="currentColor">・失敗時は管理者へ通知</text>
  <text x="442" y="134" font-size="12" fill="currentColor">・管理画面に警告バナー</text>

  <!-- 行2：push-reminders -->
  <rect x="170" y="168" width="220" height="92" rx="8" style="fill:var(--color-bg-info);stroke:var(--color-border-info)" />
  <text x="182" y="192" font-size="14" font-weight="700" style="fill:var(--color-text-info)">push-reminders</text>
  <text x="182" y="212" font-size="13" fill="currentColor">平日 7:00〜19:30（30分ごと）</text>
  <text x="182" y="232" font-size="13" fill="currentColor">期限リマインド・お知らせ</text>
  <text x="182" y="250" font-size="12" style="fill:var(--color-text-secondary)">Edge Function</text>

  <rect x="430" y="168" width="190" height="92" rx="8" style="fill:var(--color-bg-primary);stroke:var(--color-border-primary)" />
  <text x="442" y="190" font-size="13" font-weight="700" fill="currentColor">結果</text>
  <text x="442" y="210" font-size="12" fill="currentColor">・実行を毎回記録</text>
  <text x="442" y="228" font-size="12" fill="currentColor">・未実行・失敗は警告バナー</text>
  <text x="442" y="246" font-size="12" fill="currentColor">・休日はスキップを記録</text>

  <!-- 行3：清掃 -->
  <rect x="170" y="280" width="220" height="84" rx="8" style="fill:var(--color-bg-primary);stroke:var(--color-border-primary)" />
  <text x="182" y="304" font-size="14" font-weight="700" fill="currentColor">清掃 5 本</text>
  <text x="182" y="322" font-size="13" fill="currentColor">毎日 12:00〜12:10</text>
  <text x="182" y="340" font-size="12" style="fill:var(--color-text-secondary)">記録・履歴を 90 日で削除</text>
  <text x="182" y="356" font-size="12" style="fill:var(--color-text-secondary)">（うち 1 本は 14 日で削除）</text>

  <rect x="430" y="280" width="190" height="84" rx="8" style="fill:var(--color-bg-primary);stroke:var(--color-border-primary)" />
  <text x="442" y="302" font-size="13" font-weight="700" fill="currentColor">結果</text>
  <text x="442" y="322" font-size="12" fill="currentColor">・古い記録を削除</text>
  <text x="442" y="340" font-size="12" fill="currentColor">・専用の知らせはなし</text>

  <!-- 矢印：pg_cron → 各処理、処理 → 結果 -->
  <path d="M132 102 H166 M132 214 H166 M132 316 H166 M392 102 H426 M392 214 H426 M392 316 H426" style="stroke:var(--color-text-tertiary)" stroke-width="2" fill="none" />
  <path d="M159 96 L166 102 L159 108 M159 208 L166 214 L159 220 M159 310 L166 316 L159 322 M419 96 L426 102 L419 108 M419 208 L426 214 L419 220 M419 310 L426 316 L419 322" style="stroke:var(--color-text-tertiary)" stroke-width="2" fill="none" />
</svg>
