<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640">
  <!-- タスクを登録して保存するまでの流れ。保存ボタン方式を強調する。 -->
  <rect x="1" y="1" width="638" height="358" rx="10" style="fill:var(--color-bg-secondary);stroke:var(--color-border-primary)" />
  <text x="320" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">タスクを登録・保存するまでの流れ</text>

  <!-- 1 入口 -->
  <rect x="20" y="52" width="170" height="130" rx="8" style="fill:var(--color-bg-info);stroke:var(--color-border-info)" />
  <text x="105" y="78" text-anchor="middle" font-size="15" font-weight="700" style="fill:var(--color-text-info)">1. 入口</text>
  <text x="105" y="102" text-anchor="middle" font-size="13" fill="currentColor">右下の「＋」から</text>
  <text x="105" y="122" text-anchor="middle" font-size="13" fill="currentColor">「＋ タスクを追加」</text>
  <text x="105" y="146" text-anchor="middle" font-size="13" fill="currentColor">または行・カードを</text>
  <text x="105" y="166" text-anchor="middle" font-size="13" fill="currentColor">クリックして詳細を開く</text>

  <!-- 2 編集 -->
  <rect x="235" y="52" width="170" height="130" rx="8" style="fill:var(--color-bg-primary);stroke:var(--color-border-primary)" />
  <text x="320" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">2. 編集</text>
  <text x="320" y="102" text-anchor="middle" font-size="13" fill="currentColor">タスク名・担当者・</text>
  <text x="320" y="122" text-anchor="middle" font-size="13" fill="currentColor">期日・優先度・</text>
  <text x="320" y="142" text-anchor="middle" font-size="13" fill="currentColor">メモなどを入力する</text>
  <text x="320" y="168" text-anchor="middle" font-size="13" style="fill:var(--color-text-secondary)">（まだ確定していない）</text>

  <!-- 3 保存 -->
  <rect x="450" y="44" width="170" height="146" rx="8" stroke-width="3" style="fill:var(--color-bg-warning);stroke:var(--color-border-warning)" />
  <text x="535" y="72" text-anchor="middle" font-size="15" font-weight="700" style="fill:var(--color-text-warning)">3. ボタンで確定する</text>
  <rect x="462" y="86" width="68" height="34" rx="6" style="fill:var(--color-brand-light);stroke:var(--color-brand-border)" stroke-width="2" />
  <text x="496" y="109" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">追加</text>
  <rect x="540" y="86" width="68" height="34" rx="6" style="fill:var(--color-brand-light);stroke:var(--color-brand-border)" stroke-width="2" />
  <text x="574" y="109" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">保存</text>
  <text x="535" y="144" text-anchor="middle" font-size="13" fill="currentColor">新規は「追加」</text>
  <text x="535" y="164" text-anchor="middle" font-size="13" fill="currentColor">編集は「保存」</text>

  <!-- 矢印 -->
  <path d="M194 117 H231 M409 117 H446" style="stroke:var(--color-text-tertiary)" stroke-width="2" fill="none" />
  <path d="M226 111 L233 117 L226 123 M441 111 L448 117 L441 123" style="stroke:var(--color-text-tertiary)" stroke-width="2" fill="none" />

  <!-- 強調バナー -->
  <rect x="20" y="208" width="600" height="44" rx="8" style="fill:var(--color-bg-danger);stroke:var(--color-border-danger)" />
  <text x="320" y="236" text-anchor="middle" font-size="15" font-weight="700" style="fill:var(--color-text-danger)">自動保存ではありません。「追加」「保存」を押すまで確定しません。</text>

  <!-- 補足 -->
  <text x="24" y="282" font-size="13" fill="currentColor">・変更がないときは「✓ 保存済み」と表示され、ボタンは押せない</text>
  <text x="24" y="306" font-size="13" fill="currentColor">・保存せずに閉じる・別のタスクへ移る・画面を切り替えると、破棄してよいかの確認が出る</text>
  <text x="24" y="330" font-size="13" fill="currentColor">・先行タスク・追加PJ・タスクフォース・子タスクの付け外しは操作した時点で反映される</text>
</svg>
