<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512" width="640">
  <!-- AIに送られるもの／送られないもの（AI相談の場合） -->
  <rect x="1" y="1" width="638" height="510" rx="10" style="fill:var(--color-bg-secondary);stroke:var(--color-border-primary)" />
  <text x="320" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">AI相談で送られるもの・送られないもの</text>

  <!-- 左：送られる -->
  <rect x="20" y="48" width="290" height="346" rx="8" style="fill:var(--color-bg-warning);stroke:var(--color-border-warning)" />
  <text x="165" y="76" text-anchor="middle" font-size="15" font-weight="700" style="fill:var(--color-text-warning)">送られるもの</text>
  <text x="34" y="106" font-size="13" fill="currentColor">・「対象PJ」で選んだPJの未完了</text>
  <text x="34" y="124" font-size="13" fill="currentColor">　タスク（既定は進行中の全PJ）</text>
  <text x="34" y="150" font-size="13" fill="currentColor">・PJ名・目的・状態・期間</text>
  <text x="34" y="176" font-size="13" fill="currentColor">・タスク名・担当・状態・優先度・</text>
  <text x="34" y="194" font-size="13" fill="currentColor">　日付・工数</text>
  <text x="34" y="220" font-size="13" fill="currentColor">・タスクのコメント</text>
  <text x="34" y="238" font-size="13" fill="currentColor">　（パス・メールは伏せ字にして）</text>
  <text x="34" y="264" font-size="13" fill="currentColor">・部署メンバーの略称、</text>
  <text x="34" y="282" font-size="13" fill="currentColor">　相談した本人の情報</text>
  <text x="34" y="308" font-size="13" fill="currentColor">・OKRの情報（Objective名・KR名・</text>
  <text x="34" y="326" font-size="13" fill="currentColor">　今四半期のTF名・TFリーダーの略称）</text>
  <text x="34" y="352" font-size="13" fill="currentColor">・相談文と、添付した資料の文字</text>
  <text x="34" y="378" font-size="13" font-weight="700" style="fill:var(--color-text-warning)">他のメンバーのタスクも含まれる</text>

  <!-- 右：送られない -->
  <rect x="330" y="48" width="290" height="346" rx="8" style="fill:var(--color-bg-success);stroke:var(--color-border-success)" />
  <text x="475" y="76" text-anchor="middle" font-size="15" font-weight="700" style="fill:var(--color-text-success)">送られないもの</text>
  <text x="344" y="106" font-size="13" fill="currentColor">・PJの「貢献メモ」</text>
  <text x="344" y="132" font-size="13" fill="currentColor">・コメント内のファイルパス・</text>
  <text x="344" y="150" font-size="13" fill="currentColor">　メールアドレス（置き換える）</text>
  <text x="344" y="176" font-size="13" fill="currentColor">・他部署のメンバーの氏名</text>
  <text x="344" y="202" font-size="13" fill="currentColor">・個人OKRの「自分のメモ」</text>
  <text x="344" y="220" font-size="13" fill="currentColor">　（AI相談には含まれない）</text>
  <text x="344" y="246" font-size="13" fill="currentColor">・APIキー（画面側には出ない）</text>
  <text x="344" y="272" font-size="13" fill="currentColor">・完了・中止のタスク</text>
  <text x="344" y="298" font-size="13" fill="currentColor">・アーカイブ済みのPJ</text>
  <text x="344" y="316" font-size="13" fill="currentColor">　（「すべてのPJ」では完了のPJも）</text>

  <!-- 下部の注意 -->
  <rect x="20" y="410" width="600" height="90" rx="8" style="fill:var(--color-bg-primary);stroke:var(--color-border-primary)" />
  <text x="34" y="434" font-size="13" fill="currentColor">AIの返答は提案として出るだけで、「反映する」を押すまでデータは変わらない。</text>
  <text x="34" y="454" font-size="13" fill="currentColor">コメント欄には機密を書かない。</text>
  <text x="34" y="474" font-size="13" fill="currentColor">AI相談の質問文・回答文はサーバーに保存しない（端末に履歴が最大10件残る）。</text>
  <text x="34" y="494" font-size="13" fill="currentColor">PJのAI分析（最新2件）、個人OKRの見立て・下書きはデータベースに保存される。</text>
</svg>
